<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>猩红山脚下</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ebe4;
      --ink-soft: #c8b9b3;
      --ink-dim: #97857f;
      --void: #0c0a0c;
      --panel: #171316;
      --panel-raised: #1d171b;
      --line: #392b31;
      --line-strong: #5a4149;
      --crimson: #b64952;
      --crimson-bright: #ed7779;
      --gold: #c7a66b;
      --danger: #f0a0a0;
      --ok: #a9cfb2;
      --radius: 14px;
      --font-serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
      --font-sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html {
      color-scheme: dark;
      background: transparent;
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      overflow: hidden;
      padding: clamp(20px, 4vw, 48px);
      background:
        radial-gradient(1000px 520px at 88% -12%, rgba(160, 43, 54, 0.31), transparent 64%),
        radial-gradient(720px 460px at -12% 28%, rgba(90, 55, 66, 0.2), transparent 62%),
        linear-gradient(180deg, #120c10 0%, var(--void) 48%, #0b090b 100%);
      border-inline: 1px solid rgba(199, 166, 107, 0.08);
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
    }

    .kicker,
    .section-index {
      margin: 0;
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "✦";
      display: inline-block;
      margin-right: 0.75em;
      color: var(--crimson-bright);
      letter-spacing: 0;
    }

    h1 {
      margin: 0.26em 0 0.13em;
      font-family: var(--font-serif);
      font-size: clamp(2.15rem, 6.2vw, 4.7rem);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: 0.055em;
      text-wrap: balance;
      text-shadow: 0 0 54px rgba(217, 94, 100, 0.16);
    }

    .title-sub {
      margin: 0 0 22px;
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .form-shell {
      margin-top: 18px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .section {
      margin-top: 30px;
    }

    .section-head {
      display: flex;
      gap: 14px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .section-index {
      flex: none;
      color: var(--crimson-bright);
      letter-spacing: 0.12em;
    }

    h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 2.4vw, 1.65rem);
      font-weight: 500;
      letter-spacing: 0.035em;
    }

    .section-note {
      max-width: 790px;
      margin: 0 0 18px 31px;
      color: var(--ink-dim);
      font-size: 12.5px;
      line-height: 1.75;
    }

    .basic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 17px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }

    .field-label {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .optional,
    .required {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .optional { color: var(--ink-dim); }
    .required { color: var(--crimson-bright); }

    .field-hint {
      margin: -2px 0 0;
      color: var(--ink-dim);
      font-size: 11.5px;
      line-height: 1.6;
    }

    input[type="text"] {
      width: 100%;
      min-height: 43px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: rgba(8, 6, 8, 0.52);
      color: var(--ink);
      font: inherit;
      font-size: 13.5px;
      line-height: 1.6;
      transition: border-color 140ms ease, background-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"]::placeholder { color: #71625f; opacity: 1; }

    input[type="text"]:hover {
      border-color: #4d3941;
      background: rgba(12, 9, 11, 0.7);
    }

    input[type="text"]:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-color: var(--gold);
    }

    [aria-invalid="true"] {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(240, 160, 160, 0.09);
    }

    .trait-shell {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .trait-shell legend { padding: 0; }

    .trait-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .trait-card {
      position: relative;
      display: flex;
      gap: 12px;
      min-width: 0;
      padding: 15px 15px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(23, 19, 22, 0.52);
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease, opacity 150ms ease;
    }

    .trait-card:hover {
      border-color: #574049;
      background: rgba(29, 23, 27, 0.68);
    }

    .trait-card:has(.trait-input:checked) {
      border-color: rgba(199, 166, 107, 0.57);
      background:
        linear-gradient(135deg, rgba(199, 166, 107, 0.09), rgba(182, 73, 82, 0.06)),
        rgba(23, 19, 22, 0.72);
      color: var(--ink);
    }

    .trait-card:has(.trait-input:focus-visible) {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .trait-card[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .trait-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .trait-marker {
      flex: none;
      width: 17px;
      height: 17px;
      margin-top: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: rgba(8, 6, 8, 0.45);
    }

    .trait-card:has(.trait-input:checked) .trait-marker {
      border-color: var(--gold);
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(199, 166, 107, 0.08);
    }

    .trait-card:has(.trait-input:checked) .trait-marker::after {
      content: "";
      display: block;
      width: 8px;
      height: 4px;
      margin: 4px 0 0 4px;
      border-bottom: 1.5px solid #241b17;
      border-left: 1.5px solid #241b17;
      transform: rotate(-45deg);
    }

    .trait-body {
      display: block;
      min-width: 0;
    }

    .trait-title {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: baseline;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 550;
      letter-spacing: 0.02em;
      line-height: 1.45;
    }

    .trait-en,
    .shadow-en {
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .trait-points {
      display: block;
      margin-top: 7px;
    }

    .trait-point {
      display: block;
      position: relative;
      padding-left: 12px;
      color: var(--ink-dim);
      font-size: 11.5px;
      line-height: 1.65;
    }

    .trait-point::before {
      content: "·";
      position: absolute;
      left: 1px;
      color: var(--crimson-bright);
    }

    .trait-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      justify-content: space-between;
      min-height: 27px;
      margin-top: 11px;
      color: var(--ink-dim);
      font-size: 11.5px;
    }

    .trait-count {
      color: var(--gold);
      font-family: var(--font-mono);
      letter-spacing: 0.07em;
    }

    .locked-state {
      min-height: 68px;
      padding: 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(23, 19, 22, 0.36);
      color: var(--ink-dim);
      font-size: 12.5px;
    }

    .locked-state strong { color: var(--ink-soft); font-weight: 600; }

    .shadow-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .shadow-group-label {
      grid-column: 1 / -1;
      margin: 2px 0 0;
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .shadow-group-label:not(:first-child) { margin-top: 10px; }

    .shadow-card.is-pure {
      border-color: rgba(182, 73, 82, 0.3);
      background: rgba(182, 73, 82, 0.055);
    }

    .shadow-card.is-pure:hover {
      border-color: rgba(182, 73, 82, 0.56);
      background: rgba(182, 73, 82, 0.08);
    }

    .shadow-card {
      display: flex;
      gap: 11px;
      min-width: 0;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(23, 19, 22, 0.52);
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease;
    }

    .shadow-card:hover {
      border-color: #574049;
      background: rgba(29, 23, 27, 0.68);
    }

    .shadow-card:has(.shadow-input:checked) {
      border-color: rgba(182, 73, 82, 0.68);
      background:
        linear-gradient(135deg, rgba(182, 73, 82, 0.12), rgba(80, 32, 39, 0.08)),
        rgba(23, 19, 22, 0.72);
      color: var(--ink);
    }

    .shadow-card:has(.shadow-input:focus-visible) {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .shadow-input {
      flex: none;
      width: 15px;
      height: 15px;
      margin: 4px 0 0;
      accent-color: var(--crimson);
    }

    .shadow-body { display: block; min-width: 0; }

    .shadow-title {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: baseline;
      font-family: var(--font-serif);
      font-size: 14.5px;
      line-height: 1.5;
    }

    .shadow-desc {
      display: block;
      margin-top: 5px;
      color: var(--ink-dim);
      font-size: 11.5px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .actions > .button {
      flex: 1 1 100%;
      width: 100%;
    }

    button { font: inherit; }

    .button {
      min-height: 44px;
      padding: 10px 19px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .button:active { transform: translateY(1px); }

    .button:disabled,
    .button[disabled] {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
      box-shadow: none;
    }

    .button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .button-primary {
      min-width: 175px;
      border-color: rgba(237, 119, 121, 0.34);
      background: linear-gradient(135deg, #a93f49, #7e2b35);
      color: #fff7f2;
      box-shadow: 0 9px 28px rgba(78, 15, 22, 0.28);
    }

    .button-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #bb4a54, #8d323c);
    }

    .button-primary:disabled,
    .button-primary[disabled] {
      border-color: rgba(182, 73, 82, 0.24);
      background: #51373b;
      color: #b9aaa5;
    }

    .button-secondary {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.025);
      color: var(--ink-soft);
    }

    .button-secondary:hover {
      border-color: var(--gold);
      color: var(--ink);
    }

    .form-status {
      min-height: 1.5em;
      margin: 0;
      color: var(--ink-dim);
      font-size: 12px;
    }

    .form-status.is-error { color: var(--danger); }
    .form-status.is-ok { color: var(--ok); }

    .result {
      margin-top: 36px;
      padding-top: 26px;
      border-top: 1px solid var(--line-strong);
    }

    .result-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .result-head h2 { font-size: clamp(1.2rem, 2.2vw, 1.45rem); }

    .result-note {
      margin: 0;
      color: var(--ink-dim);
      font-size: 12px;
    }

    .result-text {
      width: 100%;
      min-height: 410px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
      background: rgba(7, 6, 7, 0.8);
      color: #e7dcd3;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.8;
      resize: vertical;
    }

    .result-text:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      justify-content: space-between;
      margin-top: 38px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: #756661;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.07em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 16px 26px;
        border-inline: 0;
      }

      .basic-grid,
      .trait-grid,
      .shadow-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .section-note { margin-left: 0; }
      .button-primary { width: 100%; }
      .form-status { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h2>猩红山脚下</h2>
    </header>

    <form class="form-shell" id="surveyForm" novalidate>
      <section class="section" aria-labelledby="identityHeading">
        <div class="section-head">
          <span class="section-index" aria-hidden="true">01</span>
          <h2 id="identityHeading">基本信息</h2>
        </div>
        <div class="basic-grid">
          <div class="field">
            <label class="field-label" for="name">
              主角姓名
              <span class="optional">可留空</span>
            </label>
            <input id="name" name="name" type="text" placeholder="留空则使用玩家档案名" autocomplete="off" spellcheck="false">
          </div>

          <div class="field">
            <label class="field-label" for="identity">
              性别代词/认同
              <span class="required">必填</span>
            </label>
            <input id="identity" name="identity" type="text" placeholder="她/她/他/TA/非二元/自由填写/或....." autocomplete="off" required>
          </div>

          <div class="field full">
            <label class="field-label" for="city">
              你从哪座城市来？
              <span class="required">必填</span>
            </label>
            <input id="city" name="city" type="text" placeholder="东京、大阪、秋田，或某个不愿再回去的地方……" autocomplete="off" required>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="traitHeading">
        <div class="section-head">
          <span class="section-index" aria-hidden="true">02</span>
          <h2 id="traitHeading">特质<span class="trait-en"> 从以下十三项中选择三项</span></h2>
        </div>

        <fieldset class="trait-shell">
          <legend class="sr-only">选择三项特质</legend>
          <div class="trait-grid">
            <label class="trait-card" data-trait-card="powerful">
              <input class="trait-input" type="checkbox" name="trait" value="powerful">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">身强体壮 <span class="trait-en">Powerful Build</span></span>
                <span class="trait-points">
                  <span class="trait-point">强壮的极致体现，可以把很多东西捏爆</span>
                  <span class="trait-point">气宇轩昂的气场，让旁人下意识退开半步</span>
                  <span class="trait-point">一记狠厉的右钩拳，足以终结争执</span>
                </span>
              </span>
            </label>

            <label class="trait-card" data-trait-card="mystical">
              <input class="trait-input" type="checkbox" name="trait" value="mystical">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">神秘主义 <span class="trait-en">Mystical</span></span>
                <span class="trait-points">
                  <span class="trait-point">奇怪且不寻常，像总与世界隔着一层薄雾</span>
                  <span class="trait-point">可以用常人无法理解的方式洞察现实的本质</span>
                </span>
              </span>
            </label>

            <label class="trait-card" data-trait-card="animals">
              <input class="trait-input" type="checkbox" name="trait" value="animals">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">与动物交谈 <span class="trait-en">Talk to Animals</span></span>
                <span class="trait-points">
                  <span class="trait-point">可以与动物沟通交流</span>
                  <span class="trait-point">是馈赠也是诅咒</span>
                  <span class="trait-point">能安抚狂躁生物，却总让他人背脊发凉的奇异亲和力</span>
                </span>
              </span>
            </label>

            <label class="trait-card" data-trait-card="street">
              <input class="trait-input" type="checkbox" name="trait" value="street">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">街头智慧 <span class="trait-en">Street Smart</span></span>
                <span class="trait-points">
                  <span class="trait-point">很会说谎，难以被揭穿</span>
                  <span class="trait-point">擅长用虚实难辨的话术揣摩人心</span>
                  <span class="trait-point">门锁与警戒都不再是阻碍</span>
                </span>
              </span>
            </label>

            <label class="trait-card" data-trait-card="keen">
              <input class="trait-input" type="checkbox" name="trait" value="keen">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">洞察力 <span class="trait-en">Keen Eye</span></span>
                <span class="trait-points">
                  <span class="trait-point">观察能力敏锐，善于捕捉他人忽略的细微之处</span>
                  <span class="trait-point">富有同理心，能读懂沉默背后的情绪</span>
                </span>
              </span>
            </label>

            <label class="trait-card" data-trait-card="book">
              <input class="trait-input" type="checkbox" name="trait" value="book">
              <span class="trait-marker" aria-hidden="true"></span>
              <span class="trait-body">
                <span class="trait-title">书籍智慧 <span class="trait-en">Book Smart</span></span>
                <span class="trait-points">

          element.textContent = message;
          element.classList.toggle('is-error', tone === 'error');
          element.classList.toggle('is-ok', tone === 'ok');
        }
      }

      function announce(message) {
        liveRegion.textContent = '';
        window.setTimeout(() => { liveRegion.textContent = message; }, 20);
      }

        if (!element) return;
        element.scrollIntoView({
          block: 'center',
          behavior: prefersReducedMotion ? 'auto' : 'smooth'
        });
      }

        const element = document.getElementById(id);
        return element ? element.value.trim() : '';
      }

        return traitInputs
          .filter(input => input.checked)
          .map(input => input.value)
          .sort((a, b) => TRAIT_ORDER.indexOf(a) - TRAIT_ORDER.indexOf(b));
      }

      function selectedShadowKey() {
        return Array.from(form.querySelectorAll('input[name="shadowTrait"]'))
          .find(input => input.checked)?.value || '';
      }

        return Boolean(
          textOf('identity')
          && textOf('city')
          && selectedTraitKeys().length === 3
          && selectedShadowKey()

          const disabled = count >= 3 && !input.checked;

      function clearShadowInvalid() {
        shadowLocked.removeAttribute('aria-invalid');
        shadowFieldset.removeAttribute('aria-invalid');
      }

      function appendShadowOption(key, trait, isPure, previous) {
        const label = document.createElement('label');
        label.className = 'shadow-card' + (isPure ? ' is-pure' : '');

        const input = document.createElement('input');
        input.className = 'shadow-input';
        input.type = 'radio';
        input.name = 'shadowTrait';
        input.value = key;
        input.checked = previous === key;

        const body = document.createElement('span');
        body.className = 'shadow-body';

        const title = document.createElement('span');
        title.className = 'shadow-title';
        title.textContent = isPure ? trait.name : trait.name + '的阴暗面';

        const desc = document.createElement('span');
        desc.className = 'shadow-desc';
        desc.textContent = trait.shadow;

        body.append(title, desc);
        label.append(input, body);
        shadowOptions.append(label);
      }

      function renderShadowOptions() {
        const selected = selectedTraitKeys();
        const previous = selectedShadowKey();
        const hasThree = selected.length === 3;
        clearShadowInvalid();
        shadowOptions.replaceChildren();
        shadowLocked.hidden = hasThree;

        if (hasThree) {
          const derivedLabel = document.createElement('div');
          derivedLabel.className = 'shadow-group-label';
          derivedLabel.textContent = '源自已选特质的阴暗面';
          shadowOptions.append(derivedLabel);
          selected.forEach(key => appendShadowOption(key, TRAITS[key], false, previous));
        }

        const pureLabel = document.createElement('div');
        pureLabel.className = 'shadow-group-label';
        pureLabel.textContent = '纯粹负面特质';
        shadowOptions.append(pureLabel);
        Object.entries(PURE_NEGATIVE_TRAITS).forEach(([key, trait]) => {
          appendShadowOption(key, trait, true, previous);
        });
      }

      function validateForm() {
        const identityField = document.getElementById('identity');
        const cityField = document.getElementById('city');
        const selected = selectedTraitKeys();
        const shadow = selectedShadowKey();
        const errors = [];
        const invalidFields = [];

        identityField.removeAttribute('aria-invalid');
        cityField.removeAttribute('aria-invalid');

        if (!textOf('identity')) {
          identityField.setAttribute('aria-invalid', 'true');
          errors.push('你的性别代词/认同？');
          invalidFields.push(identityField);
        }
        if (!textOf('city')) {
          cityField.setAttribute('aria-invalid', 'true');
          errors.push('来自哪座城市？');
          invalidFields.push(cityField);
        }
        if (selected.length !== 3) {
          errors.push('请选择三项特质');
          shadowLocked.setAttribute('aria-invalid', 'true');
        }
        if (selected.length === 3 && !shadow) {
          errors.push('请选择一项负面特质');
          shadowFieldset.setAttribute('aria-invalid', 'true');
        }

        if (errors.length) {
          const target = invalidFields[0]
            || (selected.length !== 3 ? document.getElementById('traitHeading') : document.getElementById('shadowHeading'));
          scrollToElement(target);
          setStatus(formStatus, errors.join('；') + '。', 'error');
          announce(errors.join('；') + '。');
          return false;
        }

        setStatus(formStatus, '', '');
        return true;
      }

      function buildArchive() {
        const name = textOf('name');
        const identity = textOf('identity');
        const city = textOf('city');
        const selected = selectedTraitKeys();
        const shadowKey = selectedShadowKey();
        const pureShadow = shadowKey ? PURE_NEGATIVE_TRAITS[shadowKey] : undefined;
        const shadow = shadowKey ? (TRAITS[shadowKey] || pureShadow) : undefined;

        const lines = [
          '> 以下为玩家设定的角色档案。请把它作为本次故事的开局资料',
          ''
        ];

        lines.push('## 开场大纲的情节', '', STORY_OUTLINE_GUIDANCE, '');

        lines.push(
          '## 主角信息',
          '',
          '- 姓名：' + (name || USER_MACRO),
          '- 性别代词/认同：' + (identity || '未填写'),
          '- 来自城市：' + (city || '未填写'),
          '',
          '## Traits',
          ''
        );

        selected.forEach((key, index) => {
          const trait = TRAITS[key];
          lines.push('### ' + (index + 1) + '. ' + trait.name + '/' + trait.en);
          trait.points.forEach(point => lines.push('- ' + point));
          lines.push('');
        });

        lines.push(
          '## 负面特质/Extremely Negative Trait',
          ''
        );

        if (shadowKey && shadow) {
          const shadowKind = pureShadow ? ' — 纯粹负面特质' : '的阴暗面';
          lines.push('### ' + shadow.name + '/' + shadow.en + shadowKind);
          lines.push('');
          lines.push(shadow.shadow);
          lines.push('');
        }

        lines.push(
          '## 后续写入 State 指引',
          '1. 获取姓名、代词、城市、三项特质和一项负面特质',
          '2. 将三项特质分别写成 `trait_1`、`trait_2`、`trait_3`',
          '3. 写入 `negative_trait`',
          '4. 根据来源写入：',
          '   - `negative_trait_kind: "derived"` 或 `"pure"`',
          '   - `negative_trait_source`：derived 时填来源特质，pure 时填空字符串。',
          '5. 写入 `background_notes`',
          '6. 最后把 `completed` 设为 `true`',
          '7. 此后这组字段视为只读，不再随剧情更新',
          '',
        );

        return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
      }

      function generateArchive(event) {
        if (event && typeof event.preventDefault === 'function') event.preventDefault();
        if (!validateForm()) return;

        resultText.value = buildArchive();
        resultPanel.hidden = false;
        generateButton.textContent = '重新生成背景';
        generateButton.title = '点击重新生成背景档案';
        announce('背景档案已生成');
        scrollToElement(resultPanel);
        window.setTimeout(() => {
          resultText.focus({ preventScroll: true });
          resultText.select();
        }, prefersReducedMotion ? 0 : 220);
      }

      async function copyArchive() {
        if (!resultText.value) return;
        window.clearTimeout(copyTimer);
        let copied = false;

        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(resultText.value);
            copied = true;
          }
        } catch (_) {
          copied = false;
        }

        if (!copied) {
          resultText.focus();
          resultText.select();
          resultText.setSelectionRange(0, resultText.value.length);
          try {
            copied = document.execCommand('copy');
          } catch (_) {
            copied = false;
          }
        }

        if (copied) {
          copyButton.textContent = '已复制';
          copyButton.removeAttribute('aria-label');
          announce('背景档案已复制到剪贴板');
        } else {
          copyButton.textContent = '手动复制';
          copyButton.setAttribute('aria-label', '自动复制不可用，请手动复制');
          announce('自动复制不可用，请手动复制');
        }

        copyTimer = window.setTimeout(() => {
          copyButton.textContent = '复制档案';
          copyButton.removeAttribute('aria-label');
        }, 2400);
      }

      function resetForm() {
        form.reset();
        resetArmed = false;
        resetButton.textContent = '清空重填';
        clearShadowInvalid();
        updateTraitControls();
        renderShadowOptions();
        updateCompletionState();
        resultPanel.hidden = true;
        resultText.value = '';
        generateButton.textContent = '生成背景';
        copyButton.textContent = '复制档案';
        copyButton.removeAttribute('aria-label');
        setStatus(formStatus, '已清空表单，可以重新填写', 'ok');
        announce('已清空表单，可以重新填写');
        document.getElementById('name').focus({ preventScroll: true });
      }

      function armReset() {
        if (!resetArmed) {
          resetArmed = true;
          resetButton.textContent = '再次点击确认清空';
          window.clearTimeout(resetTimer);
          resetTimer = window.setTimeout(() => {
            resetArmed = false;
            resetButton.textContent = '清空重填';
          }, 3200);
          return;
        }
        window.clearTimeout(resetTimer);
        resetForm();
      }

      form.addEventListener('change', event => {
        const target = event.target;
        if (target && target.classList.contains('trait-input')) {
          const selected = selectedTraitKeys();
          if (selected.length > 3) {
            target.checked = false;
            updateTraitControls();
            renderShadowOptions();
            updateCompletionState();
            setStatus(formStatus, '最多只能选择三项特质', 'error');
            announce('最多只能选择三项特质');
            return;
          }
          updateTraitControls();
          renderShadowOptions();
        }

        if (target && target.name === 'shadowTrait') {
          clearShadowInvalid();
        }

        updateCompletionState();
      });

      form.addEventListener('input', event => {
        const target = event.target;
        if (target && (target.id === 'identity' || target.id === 'city')) {
          target.removeAttribute('aria-invalid');
        }
        updateCompletionState();
      });
      generateButton.addEventListener('click', generateArchive);
      form.addEventListener('submit', generateArchive);
      copyButton.addEventListener('click', copyArchive);
      resetButton.addEventListener('click', armReset);

      updateTraitControls();
      renderShadowOptions();
      updateCompletionState();
    })();
  </script>
</body>
</html>
