# 猩红山脚下 · Loom Studio State 初始化
# 可直接粘贴到角色卡的 State 配置编辑器中。
# 玩家 Entity / loom_profile 是 Loom Studio 内置项，不要在这里重复声明。
# player.constants 是供 Prompt 宏读取的只读常量；NPC 与时间地点仍为运行态 State。

stateTemplates:
- id: player.constants
  templateVersion: 1
  label: 玩家常量（宏来源）
  schema:
    type: object
    title: 玩家常量
    description: 开始游戏后视为只读的玩家常量；通过 Timeline State 宏稳定注入 Prompt。
    additionalProperties: false
    required:
    - completed
    - pronouns
    - city
    - trait_1
    - trait_2
    - trait_3
    - negative_trait
    - negative_trait_kind
    - negative_trait_source
    - background_notes
    properties:
      completed:
        type: boolean
        title: 是否完成初始化
      pronouns:
        type: string
        maxLength: 120
        title: 性别代词 / 性别认同
      city:
        type: string
        maxLength: 120
        title: 来自城市
      trait_1:
        type: string
        maxLength: 1200
        title: 特质一
      trait_2:
        type: string
        maxLength: 1200
        title: 特质二
      trait_3:
        type: string
        maxLength: 1200
        title: 特质三
      negative_trait:
        type: string
        maxLength: 1200
        title: 负面特质
      negative_trait_kind:
        type: string
        enum:
        - ''
        - derived
        - pure
        title: 负面特质类型
      negative_trait_source:
        type: string
        maxLength: 200
        title: 负面特质来源
      background_notes:
        type: string
        maxLength: 4000
        title: 其他背景备注
  initial:
    completed: false
    pronouns: ''
    city: ''
    trait_1: ''
    trait_2: ''
    trait_3: ''
    negative_trait: ''
    negative_trait_kind: ''
    negative_trait_source: ''
    background_notes: ''
- id: npc.profile
  templateVersion: 1
  label: NPC 角色档案
  componentKey: profile
  targetEntityTypeIds:
  - npc
  schema:
    type: object
    title: NPC 角色档案
    description: NPC 的运行态字段
    additionalProperties: false
    required:
    - name
    - age
    - role
    - faction
    - summary
    - personality_axes
    - coexistence_note
    - relationship_to_player
    - status
    - current_goal
    - notes
    properties:
      name:
        type: string
        maxLength: 120
        title: 姓名
      age:
        type: integer
        minimum: 0
        maximum: 300
        title: 年龄
      role:
        type: string
        maxLength: 160
        title: 身份 / 职业
      faction:
        type: string
        enum:
        - 北条家
        - 今川家
        - 神月家
        - 瑞穗集团
        - 町民
        - 外来者
        - 其他
        title: 阵营 / 归属
      summary:
        type: string
        maxLength: 500
        title: 简介
      personality_axes:
        type: object
        title: 人格轴
        additionalProperties: false
        required:
        - open
        - closed
        - bold
        - passive
        - insightful
        - dull
        - reliable
        - unreliable
        - agreeable
        - adversarial
        properties:
          open:
            type: integer
            minimum: 0
            maximum: 10
          closed:
            type: integer
            minimum: 0
            maximum: 10
          bold:
            type: integer
            minimum: 0
            maximum: 10
          passive:
            type: integer
            minimum: 0
            maximum: 10
          insightful:
            type: integer
            minimum: 0
            maximum: 10
          dull:
            type: integer
            minimum: 0
            maximum: 10
          reliable:
            type: integer
            minimum: 0
            maximum: 10
          unreliable:
            type: integer
            minimum: 0
            maximum: 10
          agreeable:
            type: integer
            minimum: 0
            maximum: 10
          adversarial:
            type: integer
            minimum: 0
            maximum: 10
      coexistence_note:
        type: string
        maxLength: 500
        title: 人格轴共存说明
      relationship_to_player:
        type: integer
        minimum: -10
        maximum: 10
        title: 对玩家关系值
      status:
        type: string
        enum:
        - active
        - missing
        - dead
        - transformed
        - unknown
        title: 当前状态
      current_goal:
        type: string
        maxLength: 300
        title: 当前目标
      notes:
        type: string
        maxLength: 1000
        title: 运行备注
  initial:
    name: 未命名NPC
    age: 0
    role: ''
    faction: 其他
    summary: ''
    personality_axes:
      open: 5
      closed: 5
      bold: 5
      passive: 5
      insightful: 5
      dull: 5
      reliable: 5
      unreliable: 5
      agreeable: 5
      adversarial: 5
    coexistence_note: ''
    relationship_to_player: 0
    status: active
    current_goal: ''
    notes: ''
- id: world.time
  templateVersion: 1
  label: 当前时间
  schema:
    type: object
    title: 当前时间
    additionalProperties: false
    required:
    - day
    - hour
    - minute
    properties:
      day:
        type: integer
        minimum: 1
        title: 第几天
      hour:
        type: integer
        minimum: 0
        maximum: 23
        title: 小时
      minute:
        type: integer
        minimum: 0
        maximum: 59
        title: 分钟
  initial:
    day: 1
    hour: 19
    minute: 0
- id: world.location
  templateVersion: 1
  label: 当前地点
  schema:
    type: object
    title: 当前地点
    additionalProperties: false
    required:
    - id
    - name
    - region
    - scene
    properties:
      id:
        type: string
        maxLength: 120
        title: 地点 ID
      name:
        type: string
        maxLength: 120
        title: 地点名称
      region:
        type: string
        maxLength: 120
        title: 所属区域
      scene:
        type: string
        maxLength: 160
        title: 具体场景
  initial:
    id: chisei_cho_annai_sho
    name: 秩聖町
    region: 猩红山脚下
    scene: 案内所
